[project]
name = "polyglottarium"
version = "0.1.0"
description = "Analysis of Multi-Lingual New Testament Documents"
authors = [
    {name = "Robert Turnbull",email = "robert.turnbull@unimelb.edu.au"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml (>=6.0.2,<7.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
