[project]
name = "hexapla"
version = "0.1.0"
description = "Static websites for reading and exploring word-aligned manuscript texts"
authors = [
    {name = "Robert Turnbull", email = "robert.turnbull@unimelb.edu.au"}
]
license = {text = "Apache-2.0"}
readme = "README.rst"
requires-python = ">=3.11"
keywords = ["digital humanities", "manuscripts", "TEI", "CoNLL-U", "word alignment", "parallel texts",
            "static site generator", "New Testament", "textual criticism"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "pyyaml (>=6.0.2,<7.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "typer (>=0.21.1)",
    "pydantic (>=2.7,<3.0.0)",
    "libsass (>=0.23.0)",
    "markdown-it-py (>=3.0.0)",
    "mdit-py-plugins (>=0.4.0)",
    "rich (>=13.0.0)",
]

[project.scripts]
hexapla = "hexapla.main:app"

[project.urls]
Homepage = "https://github.com/rbturnbull/hexapla"
Documentation = "https://rbturnbull.github.io/hexapla/"
Repository = "https://github.com/rbturnbull/hexapla"
Issues = "https://github.com/rbturnbull/hexapla/issues"
Changelog = "https://rbturnbull.github.io/hexapla/changelog.html"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hexapla"]

[tool.hatch.build.targets.sdist]
include = ["hexapla", "tests", "docs", "README.rst", "CHANGELOG.rst", "CITATION.cff", "LICENSE", "action.yml"]
exclude = ["docs/_build", "docs/_generated"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
]
docs = [
    "sphinx>=8",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5",
]

[tool.pytest.ini_options]
addopts = "--cov=hexapla --cov-report=term-missing"

[tool.coverage.report]
fail_under = 100
show_missing = true
