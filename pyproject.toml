[project]
name = "bilingualnavigator"
version = "0.1.0"
description = "Analysis of Multi-Lingual New Testament Documents"
authors = [
    {name = "Robert Turnbull",email = "robert.turnbull@unimelb.edu.au"}
]
license = {text = "Apache-2.0"}
readme = "README.rst"
requires-python = ">=3.11"
dependencies = [
    "pyyaml (>=6.0.2,<7.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "typer (>=0.21.1,<0.22.0)",
    "certifi (>=2026.2.25,<2027.0.0)",
    "lxml (>=6.0.2,<7.0.0)"
]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
bilingualnavigator = "bilingualnavigator.main:app"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"

