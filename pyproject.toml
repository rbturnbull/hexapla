[project]
name = "hexapla"
version = "0.1.0"
description = "Static websites for reading and exploring word-aligned manuscript texts"
authors = [
    {name = "Robert Turnbull", email = "robert.turnbull@unimelb.edu.au"}
]
license = {text = "Apache-2.0"}
readme = "README.rst"
requires-python = ">=3.11"
dependencies = [
    "pyyaml (>=6.0.2,<7.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "typer (>=0.21.1,<0.22.0)",
    "pydantic (>=2.7,<3.0.0)",
    "libsass (>=0.23.0)",
    "markdown-it-py (>=3.0.0)",
    "rich (>=13.0.0)",
]

[project.scripts]
hexapla = "hexapla.main:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "hexapla"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"

[tool.poetry.group.docs.dependencies]
sphinx = ">=8"
furo = ">=2024"
sphinx-copybutton = ">=0.5"

[tool.pytest.ini_options]
addopts = "--cov=hexapla --cov-report=term-missing"

[tool.coverage.report]
fail_under = 100
show_missing = true
