name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Test (100% coverage required)
        run: uv run --locked pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - name: Build and check the package
        run: |
          uv build
          uvx twine check --strict dist/*
      - name: Install the wheel and build the test project
        run: |
          uv venv --python 3.13 /tmp/wheel-test
          uv pip install --python /tmp/wheel-test/bin/python dist/*.whl
          /tmp/wheel-test/bin/hexapla --version
          /tmp/wheel-test/bin/hexapla build tests/data/project/project.yaml --output /tmp/wheel-site

  action:
    # Runs the action itself on the test project, without deploying.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          config: tests/data/project/project.yaml
          deploy: "false"
      - name: Check the site was built
        run: test -f _site/index.html && test -f _site/alignments/claro/index.html
