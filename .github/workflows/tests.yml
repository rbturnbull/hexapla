name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install . pytest pytest-cov
      - name: Test (100% coverage required)
        run: python -m pytest

  action:
    # Runs the action itself on the test project, without deploying.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          config: tests/data/project/project.yaml
          deploy: "false"
      - name: Check the site was built
        run: test -f _site/index.html && test -f _site/alignments/claro/index.html
