# Publishes Hexapla to PyPI when a version tag (v0.1.0) is pushed. Needs a PYPI_TOKEN secret in the repository.
name: publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Test (100% coverage required)
        run: |
          uv sync --locked --group dev
          uv run --locked pytest
      - name: Check the tag matches the version
        run: test "v$(uv run --locked python -c 'import hexapla; print(hexapla.__version__)')" = "${GITHUB_REF_NAME}"
      - name: Build and check
        run: |
          uv build
          uvx twine check --strict dist/*
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
