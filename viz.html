<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dependency Parse Viewer (Fixed)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Plus&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Gentium Plus", serif;
    }
    .token {
      font-size: 24px;
      cursor: pointer;
    }
    .root {
      fill: blue;
      font-weight: bold;
    }
    .arc {
      fill: none;
      stroke: #ccc;
      stroke-width: 1.5px;
      marker-end: url(#arrowhead);
    }
    .arc-highlight-in {
      stroke: red;
      stroke-width: 2.5px;
      marker-end: url(#arrowhead-red);
    }
    .arc-highlight-out {
      stroke: blue;
      stroke-width: 2.5px;
      marker-end: url(#arrowhead-blue);
    }
    .arc-label {
      font-size: 14px;
      text-anchor: middle;
      fill: blue;
      font-style: italic;
    }
    .features {
      font-size: 12px;
      fill: green;
      text-anchor: middle;
    }
    svg {
      display: block;
      margin-bottom: 60px;
    }
  </style>
</head>
<body>

<svg id="svg1" width="1200" height="340"></svg>
<svg id="svg2" width="1200" height="340"></svg>

<script>
const sentences = [
  {
    svgId: "svg1",
    data: `1	εἴδομεν	ὁράω	VERB	V-	Aspect=Perf|Mood=Ind|Number=Plur|Person=1|Tense=Past|VerbForm=Fin|Voice=Act	0	root
2	γὰρ	γάρ	ADV	Df	_	1	discourse
3	αὐτοῦ	αὐτός	PRON	Pp	Case=Gen|Gender=Masc|Number=Sing|Person=3|PronType=Prs	5	det
4	τὸν	ὁ	DET	S-	Case=Acc|Definite=Def|Gender=Masc|Number=Sing|PronType=Dem	5	det
5	ἀστέρα	ἀστήρ	NOUN	Nb	Case=Acc|Gender=Masc|Number=Sing	1	obj
6	ἐν	ἐν	ADP	R-	_	8	case
7	τῇ	ὁ	DET	S-	Case=Dat|Definite=Def|Gender=Fem|Number=Sing|PronType=Dem	8	det
8	ἀνατολῇ	ἀνατολή	NOUN	Nb	Case=Dat|Gender=Fem|Number=Sing	1	obl
9	καὶ	καί	CCONJ	C-	_	10	cc
10	ἤλθομεν	ἔρχομαι	VERB	V-	Aspect=Perf|Mood=Ind|Number=Plur|Person=1|Tense=Past|VerbForm=Fin|Voice=Act	1	conj
11	προσκυνῆσαι	προσκυνέω	VERB	V-	Aspect=Perf|Tense=Past|VerbForm=Inf|Voice=Act	10	xcomp
12	αὐτῷ	αὐτός	PRON	Pp	Case=Dat|Gender=Masc|Number=Sing|Person=3|PronType=Prs	11	obl:arg`
  },
  {
    svgId: "svg2",
    data: `1	vidimus	video	VERB	V-	Aspect=Perf|Mood=Ind|Number=Plur|Person=1|Tense=Past|VerbForm=Fin|Voice=Act	0	root
2	enim	enim	ADV	Df	_	1	discourse
3	stellam	stella	NOUN	Nb	Case=Acc|Gender=Fem|Number=Sing	1	obj
4	eius	is	PRON	Pp	Case=Gen|Gender=Masc|Number=Sing|Person=3|PronType=Prs	3	det
5	in	in	ADP	R-	_	6	case
6	oriente	oriens	NOUN	Nb	Case=Abl|Gender=Masc|Number=Sing	1	obl
7	et	et	CCONJ	C-	_	8	cc
8	venimus	venio	VERB	V-	Aspect=Perf|Mood=Ind|Number=Plur|Person=1|Tense=Past|VerbForm=Fin|Voice=Act	1	conj
9	adorare	adoro	VERB	V-	Tense=Pres|VerbForm=Inf|Voice=Act	8	advcl
10	eum	is	PRON	Pp	Case=Acc|Gender=Masc|Number=Sing|Person=3|PronType=Prs	9	obj`
  }
];

sentences.forEach(renderSentence);

function renderSentence({ svgId, data }) {
  const svg = d3.select(`#${svgId}`);
  const margin = { top: 60, bottom: 100, left: 50, right: 50 };
  const height = +svg.attr("height");
  const arcHeight = 50;
  const tokenY = height - margin.bottom;

  // Add marker definitions inside each SVG
  const defs = svg.append("defs");
  defineArrow(defs, "arrowhead", "#ccc");
  defineArrow(defs, "arrowhead-blue", "blue");
  defineArrow(defs, "arrowhead-red", "red");

  const tokens = data.split("\n").map(line => {
    const [id, form, lemma, upos, xpos, feats, head, deprel] = line.split("\t");
    return { id: +id, form, lemma, upos, feats, head: +head, deprel };
  });

  // Fix: ID → index map
  const idToIndex = Object.fromEntries(tokens.map((t, i) => [t.id, i]));

  const ctx = document.createElement("canvas").getContext("2d");
  ctx.font = "24px Gentium Plus";
  tokens.forEach(t => t.width = ctx.measureText(t.form).width);

  const space = 20;
  let currentX = margin.left;
  const positions = tokens.map(t => {
    const x = currentX + t.width / 2;
    currentX += t.width + space;
    return x;
  });

  svg.selectAll(".token")
    .data(tokens)
    .enter()
    .append("text")
    .attr("class", d => "token" + (d.head === 0 ? " root" : ""))
    .attr("x", (_, i) => positions[i])
    .attr("y", tokenY)
    .attr("text-anchor", "middle")
    .text(d => d.form)
    .on("mouseover", highlight)
    .on("mouseout", clearHighlight);

  svg.selectAll(".arc")
    .data(tokens.filter(t => t.head !== 0))
    .enter()
    .append("path")
    .attr("class", "arc")
    .attr("d", d => arcPath(idToIndex[d.id], idToIndex[d.head]));

  function arcPath(depIdx, headIdx) {
    const x1 = positions[depIdx];
    const x2 = positions[headIdx];
    const y = tokenY - 30;
    const radius = Math.abs(x2 - x1) / 2;
    return `M${x1},${y} A${radius},${arcHeight} 0 0,${x1 < x2 ? 1 : 0} ${x2},${y}`;
  }

  function highlight(event, d) {
    clearHighlight();
    const idx = idToIndex[d.id];
    const headIdx = idToIndex[d.head];
    const y = tokenY - 30;
    const x = positions[idx];

    if (d.head !== 0) {
      svg.append("path")
        .attr("class", "arc arc-highlight-out")
        .attr("d", arcPath(idx, headIdx))
        .attr("id", "highlight-out");

      const labelX = (x + positions[headIdx]) / 2;
      svg.append("text")
        .attr("class", "arc-label")
        .attr("x", labelX)
        .attr("y", y - arcHeight - 5)
        .text(d.deprel)
        .attr("id", "dep-label");
    }

    tokens.forEach((t, i) => {
      if (t.head === d.id) {
        svg.append("path")
          .attr("class", "arc arc-highlight-in")
          .attr("d", arcPath(i, idx))
          .attr("id", "highlight-in-" + t.id);
      }
    });

    const featLines = (d.feats && d.feats !== "_") ? d.feats.split("|") : [];
    const lines = [d.upos, ...featLines];

    lines.forEach((line, i) => {
      svg.append("text")
        .attr("class", "features")
        .attr("x", x)
        .attr("y", tokenY + 20 + i * 14)
        .attr("text-anchor", "middle")
        .attr("id", `upos-feats-line-${i}`)
        .text(line);
    });
  }

  function clearHighlight() {
    svg.selectAll("#highlight-out").remove();
    svg.selectAll('[id^="highlight-in-"]').remove();
    svg.selectAll("#dep-label").remove();
    svg.selectAll('[id^="upos-feats-line-"]').remove();
  }

  function defineArrow(defs, id, color) {
    defs.append("marker")
      .attr("id", id)
      .attr("viewBox", "0 -5 10 10")
      .attr("refX", 10)
      .attr("refY", 0)
      .attr("markerWidth", 6)
      .attr("markerHeight", 6)
      .attr("orient", "auto")
      .append("path")
      .attr("d", "M0,-5L10,0L0,5")
      .attr("fill", color);
  }
}
</script>
</body>
</html>
