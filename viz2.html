<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bilingual Navigator</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Plus&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Gentium Plus", serif;
    }
    .token {
      font-size: 24px;
      cursor: pointer;
    }
    .root {
      fill: blue;
      font-weight: bold;
    }
    .arc {
      fill: none;
      stroke: #ddd;
      stroke-width: 1.5px;
      marker-end: url(#arrowhead);
    }
    .arc-highlight-in {
      stroke: red;
      stroke-width: 2.5px;
      marker-end: url(#arrowhead-red);
    }
    .arc-highlight-out {
      stroke: blue;
      stroke-width: 2.5px;
      marker-end: url(#arrowhead-blue);
    }
    .arc-label {
      font-size: 14px;
      text-anchor: middle;
      fill: blue;
      font-style: italic;
    }
    .features {
      font-size: 12px;
      fill: green;
      text-anchor: middle;
    }
    .token-bg {
      fill: yellow;
      opacity: 0.5;
    }
    svg {
      display: block;
      margin-bottom: 60px;
    }
  </style>
</head>
<body>
<svg id="svg1" width="1200" height="340"></svg>
<svg id="svg2" width="1200" height="340"></svg>
<script type="module" src="script.js"></script>
</body>
</html>
